name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: policy_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d policy_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/policy_rag_test
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-all-MiniLM-L6-v2-v1
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (real PostgreSQL + pgvector)
        run: pytest tests/integration -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Ingest the sample policies inside the container
        run: docker compose exec -T api python -m scripts.ingest
      - name: Check the ingested documents through the API
        run: |
          curl -sf http://localhost:8000/api/documents | python -c "
          import json, sys
          docs = json.load(sys.stdin)
          assert len(docs) == 7, docs
          assert sum(d['chunks'] for d in docs) > 20
          assert {d['embedding_dim'] for d in docs} == {384}
          print(len(docs), 'documents ingested')
          "
      - name: Show service state
        if: always()
        run: docker compose ps
      - name: Stop the stack
        if: always()
        run: docker compose down -v
