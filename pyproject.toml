[project]
name = "policy-rag-pgvector"
version = "0.1.0"
description = "RAG retrieval platform: PostgreSQL + pgvector semantic search over policy documents"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Rules are listed explicitly so a new ruff release cannot change what CI enforces.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL with pgvector (TEST_DATABASE_URL)",
    "model: loads the real embedding model (downloads it on first use)",
]

[tool.bandit]
# B101: asserts are used to narrow types for mypy, not for security checks.
skips = ["B101"]
