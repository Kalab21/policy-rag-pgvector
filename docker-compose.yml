# Local stack: PostgreSQL with the pgvector extension, and the API.
# Credentials default to the local-only values in .env.example.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policy_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policy_rag_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-policy_rag}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        # The image downloads this model at build time, so build and runtime must agree.
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
        RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-policy_rag}:${POSTGRES_PASSWORD:-policy_rag_local_only}@db:5432/${POSTGRES_DB:-policy_rag}
      # Defaults below match app/core/config.py.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      CHUNK_SIZE: ${CHUNK_SIZE:-700}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      HNSW_M: ${HNSW_M:-16}
      HNSW_EF_CONSTRUCTION: ${HNSW_EF_CONSTRUCTION:-64}
      HNSW_EF_SEARCH: ${HNSW_EF_SEARCH:-40}
      # Observability. Nothing is exported unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-policy-rag-platform}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RECORD_QUERY_TEXT: ${RECORD_QUERY_TEXT:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_TOOL_TIMEOUT_S: ${MCP_TOOL_TIMEOUT_S:-30}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-semantic}
      RRF_K: ${RRF_K:-60}
      HYBRID_CANDIDATES: ${HYBRID_CANDIDATES:-30}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      EVIDENCE_MIN_SIMILARITY: ${EVIDENCE_MIN_SIMILARITY:-0.55}
      RAG_MAX_CONTEXT_CHUNKS: ${RAG_MAX_CONTEXT_CHUNKS:-4}
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      # Optional, used only when LLM_PROVIDER=openai_compatible. Empty means unset.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Bedrock (LLM_PROVIDER=bedrock). Credentials are NOT set here: mount or inject them the
      # standard AWS way (AWS_PROFILE with a mounted ~/.aws, or an IAM role when deployed).
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-512}
      BEDROCK_TEMPERATURE: ${BEDROCK_TEMPERATURE:-0.0}
      BEDROCK_TIMEOUT_S: ${BEDROCK_TIMEOUT_S:-30}
      BEDROCK_MAX_RETRIES: ${BEDROCK_MAX_RETRIES:-2}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
