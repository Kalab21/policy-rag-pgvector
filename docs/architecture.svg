<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1500" width="1400" height="1500" role="img" aria-label="Policy RAG Platform logical architecture. A REST API client or MCP consumer sends a bearer token; JWT validation produces an access scope (roles, tenant, department, access level) that is applied inside every retrieval query against PostgreSQL 16 with pgvector. Semantic, lexical or hybrid retrieval, optional cross-encoder reranking and an evidence gate run only on authorized chunks; LangGraph generation and citation validation return an answer with sources or a refusal. OpenTelemetry, Prometheus, held-out evaluation and CI run across the platform.">
<style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="1400" height="1500" fill="#ffffff"/>
<rect x="60" y="330" width="930" height="850" rx="18" fill="#fafbff" stroke="#9a6700" stroke-width="2" stroke-dasharray="7 6"/>
<text x="82" y="358" font-size="15" font-weight="700" fill="#9a6700" text-anchor="start">Authorized scope: permitted chunks only</text>
<rect x="1030" y="400" width="310" height="196" rx="18" fill="#eef6fb" stroke="#0b6f8a" stroke-width="2" stroke-dasharray="7 6"/>
<text x="1052" y="428" font-size="15" font-weight="700" fill="#0b6f8a" text-anchor="start">Data</text>
<rect x="100" y="908" width="850" height="248" rx="18" fill="#f7f2fd" stroke="#7a3fb8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="122" y="936" font-size="15" font-weight="700" fill="#7a3fb8" text-anchor="start">AI generation boundary: gated chunks only</text>
<rect x="60" y="1350" width="1280" height="130" rx="18" fill="#fafbff" stroke="#9aa3d9" stroke-width="2" stroke-dasharray="7 6"/>
<text x="82" y="1378" font-size="15" font-weight="700" fill="#9aa3d9" text-anchor="start">Across the platform</text>
<rect x="225" y="30" width="600" height="100" rx="12" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="525.0" y="64.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Client  /  MCP consumer</text>
<text x="525.0" y="88.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">REST API: search · ask · documents</text>
<text x="525.0" y="109.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">MCP tool server (stdio): read-only, bounded tools</text>
<path d="M525.0,130.0 L525.0,171.0" fill="none" stroke="#3f4ab8" stroke-width="2.5"/>
<path d="M525.0,184.0 L532.0,171.0 L518.0,171.0 z" fill="#3f4ab8"/>
<text x="539" y="163" font-size="13.5" font-weight="600" fill="#3f4ab8" text-anchor="start">bearer token (JWT)</text>
<rect x="175" y="184" width="700" height="112" rx="12" fill="#fff8e6" stroke="#9a6700" stroke-width="2"/>
<text x="525.0" y="224.0" font-size="18" font-weight="700" fill="#9a6700" text-anchor="middle">Authentication + access scope</text>
<text x="525.0" y="248.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">JWT validation: OIDC/JWKS or PEM key · algorithm allowlist</text>
<text x="525.0" y="269.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">→ roles · tenant · department · highest access level</text>
<path d="M525.0,296.0 L525.0,387.0" fill="none" stroke="#9a6700" stroke-width="2.5"/>
<path d="M525.0,400.0 L532.0,387.0 L518.0,387.0 z" fill="#9a6700"/>
<text x="539" y="356" font-size="13.5" font-weight="600" fill="#9a6700" text-anchor="start">access scope, applied inside every query</text>
<rect x="100" y="400" width="850" height="196" rx="14" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="122" y="428" font-size="16" font-weight="700" fill="#3f4ab8" text-anchor="start">Retrieval layer</text>
<rect x="122" y="446" width="254" height="128" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="249.0" y="494.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Semantic (vector)</text>
<text x="249.0" y="518.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">pgvector HNSW</text>
<text x="249.0" y="539.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">cosine similarity</text>
<rect x="398" y="446" width="254" height="128" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="525.0" y="494.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Lexical</text>
<text x="525.0" y="518.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">PostgreSQL full-text</text>
<text x="525.0" y="539.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">tsvector + GIN</text>
<rect x="674" y="446" width="254" height="128" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="801.0" y="494.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Hybrid</text>
<text x="801.0" y="518.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">semantic + lexical</text>
<text x="801.0" y="539.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">Reciprocal Rank Fusion</text>
<rect x="1052" y="446" width="266" height="128" rx="12" fill="#ffffff" stroke="#0b6f8a" stroke-width="2"/>
<text x="1185.0" y="483.0" font-size="18" font-weight="700" fill="#0b6f8a" text-anchor="middle">PostgreSQL 16</text>
<text x="1185.0" y="507.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">+ pgvector</text>
<text x="1185.0" y="528.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">chunks · embeddings</text>
<text x="1185.0" y="549.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">tenant · dept · level</text>
<path d="M950.0,510.0 L1039.0,510.0" fill="none" stroke="#0b6f8a" stroke-width="2.5"/>
<path d="M1052.0,510.0 L1039.0,503.0 L1039.0,517.0 z" fill="#0b6f8a"/>
<text x="990" y="500" font-size="13.5" font-weight="600" fill="#0b6f8a" text-anchor="middle">SQL</text>
<path d="M525.0,596.0 L525.0,627.0" fill="none" stroke="#3f4ab8" stroke-width="2.5"/>
<path d="M525.0,640.0 L532.0,627.0 L518.0,627.0 z" fill="#3f4ab8"/>
<rect x="305" y="640" width="440" height="86" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="525.0" y="678.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Cross-encoder reranking (optional)</text>
<text x="525.0" y="702.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">re-orders a bounded candidate set</text>
<path d="M525.0,726.0 L525.0,757.0" fill="none" stroke="#3f4ab8" stroke-width="2.5"/>
<path d="M525.0,770.0 L532.0,757.0 L518.0,757.0 z" fill="#3f4ab8"/>
<rect x="305" y="770" width="440" height="92" rx="12" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="525.0" y="811.0" font-size="18" font-weight="700" fill="#3f4ab8" text-anchor="middle">Evidence gate</text>
<text x="525.0" y="835.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">best similarity ≥ threshold?</text>
<path d="M525.0,862.0 L525.0,927.0" fill="none" stroke="#3f4ab8" stroke-width="2.5"/>
<path d="M525.0,940.0 L532.0,927.0 L518.0,927.0 z" fill="#3f4ab8"/>
<text x="539" y="890" font-size="13.5" font-weight="600" fill="#3f4ab8" text-anchor="start">sufficient evidence</text>
<rect x="220" y="950" width="610" height="92" rx="12" fill="#ffffff" stroke="#7a3fb8" stroke-width="2"/>
<text x="525.0" y="991.0" font-size="18" font-weight="700" fill="#7a3fb8" text-anchor="middle">LangGraph generation</text>
<text x="525.0" y="1015.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">extractive (default) · Bedrock / OpenAI-compatible (optional)</text>
<path d="M525.0,1042.0 L525.0,1053.0" fill="none" stroke="#7a3fb8" stroke-width="2.5"/>
<path d="M525.0,1066.0 L532.0,1053.0 L518.0,1053.0 z" fill="#7a3fb8"/>
<rect x="305" y="1066" width="440" height="72" rx="12" fill="#ffffff" stroke="#7a3fb8" stroke-width="2"/>
<text x="525.0" y="1097.0" font-size="18" font-weight="700" fill="#7a3fb8" text-anchor="middle">Citation validation</text>
<text x="525.0" y="1121.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">every [n] must match a supplied chunk</text>
<path d="M525.0,1138.0 L525.0,1213.0" fill="none" stroke="#2e7d4f" stroke-width="2.5"/>
<path d="M525.0,1226.0 L532.0,1213.0 L518.0,1213.0 z" fill="#2e7d4f"/>
<text x="539" y="1206" font-size="13.5" font-weight="600" fill="#2e7d4f" text-anchor="start">valid citations</text>
<rect x="305" y="1226" width="440" height="84" rx="12" fill="#eef7f1" stroke="#2e7d4f" stroke-width="2"/>
<text x="525.0" y="1263.0" font-size="18" font-weight="700" fill="#2e7d4f" text-anchor="middle">Answer with sources</text>
<text x="525.0" y="1287.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">cited chunks and document references</text>
<rect x="1040" y="1226" width="300" height="84" rx="12" fill="#fdf0ef" stroke="#b42318" stroke-width="2"/>
<text x="1190.0" y="1263.0" font-size="18" font-weight="700" fill="#b42318" text-anchor="middle">Refusal</text>
<text x="1190.0" y="1287.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">no sources · reason returned</text>
<path d="M745.0,816.0 L1250.0,816.0 L1250.0,1213.0" fill="none" stroke="#b42318" stroke-width="2.5"/>
<path d="M1250.0,1226.0 L1257.0,1213.0 L1243.0,1213.0 z" fill="#b42318"/>
<text x="1000" y="806" font-size="13.5" font-weight="600" fill="#b42318" text-anchor="middle">insufficient evidence</text>
<path d="M745.0,1102.0 L1120.0,1102.0 L1120.0,1213.0" fill="none" stroke="#b42318" stroke-width="2.5"/>
<path d="M1120.0,1226.0 L1127.0,1213.0 L1113.0,1213.0 z" fill="#b42318"/>
<text x="1052" y="1092" font-size="13.5" font-weight="600" fill="#b42318" text-anchor="middle">no valid citation</text>
<rect x="84" y="1390" width="296" height="72" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="232.0" y="1421.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">OpenTelemetry</text>
<text x="232.0" y="1445.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">traces per pipeline stage</text>
<rect x="396" y="1390" width="296" height="72" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="544.0" y="1421.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Prometheus + JSON logs</text>
<text x="544.0" y="1445.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">no question or document text</text>
<rect x="708" y="1390" width="296" height="72" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="856.0" y="1421.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Evaluation</text>
<text x="856.0" y="1445.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">held-out + tuning sets</text>
<rect x="1020" y="1390" width="296" height="72" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="1168.0" y="1421.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">GitHub Actions CI</text>
<text x="1168.0" y="1445.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">tests · types · IaC · security</text>
</svg>
