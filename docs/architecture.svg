<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1290" width="1400" height="1290" role="img" aria-label="Policy RAG Platform architecture: JWT access scope, semantic, lexical and hybrid retrieval on PostgreSQL and pgvector, optional cross-encoder reranking, evidence gate, LangGraph generation, citation validation, answer or refusal">
<defs>
<marker id="head-3f4ab8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4ab8"/></marker>
<marker id="head-2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
<marker id="head-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="1400" height="1290" fill="#ffffff"/>
<rect x="60" y="40" width="380" height="96" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="250.0" y="71.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">Client</text>
<text x="250.0" y="93.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">HTTP API: /api/search, /api/ask</text>
<text x="250.0" y="115.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">MCP tool server (stdio)</text>
<rect x="580" y="40" width="760" height="96" rx="12" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="960.0" y="71.0" font-size="19" font-weight="700" fill="#3f4ab8" text-anchor="middle">Authentication and access scope</text>
<text x="960.0" y="93.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">JWT validation (issuer, audience, signature, expiry)  →  roles, tenant, department</text>
<text x="960.0" y="115.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">The scope is applied inside every query below, before anything is ranked</text>
<line x1="440" y1="88" x2="580" y2="88" stroke="#3f4ab8" stroke-width="2.5" marker-end="url(#head-3f4ab8)"/>
<text x="510.0" y="76.0" font-size="14" font-weight="600" fill="#3f4ab8" text-anchor="middle">bearer token</text>
<rect x="60" y="190" width="1280" height="270" rx="16" fill="#fafbff" stroke="#9aa3d9" stroke-width="2"/>
<text x="84" y="224" font-size="19" font-weight="700" fill="#3f4ab8" text-anchor="start">PostgreSQL 16 + pgvector</text>
<text x="84" y="248" font-size="15" font-weight="400" fill="#4b587c" text-anchor="start">metadata filters and the access scope are applied in SQL inside each retriever</text>
<rect x="100" y="280" width="380" height="150" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="290.0" y="327.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">Semantic  (default)</text>
<text x="290.0" y="349.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">MiniLM embedding (384 dims)</text>
<text x="290.0" y="371.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">pgvector HNSW index</text>
<text x="290.0" y="393.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">cosine similarity</text>
<rect x="510.0" y="280" width="380" height="150" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="700.0" y="327.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">Lexical</text>
<text x="700.0" y="349.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">PostgreSQL full-text search</text>
<text x="700.0" y="371.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">tsvector + GIN index</text>
<text x="700.0" y="393.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">ranked with ts_rank</text>
<rect x="920" y="280" width="380" height="150" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1110.0" y="327.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">Hybrid  (optional)</text>
<text x="1110.0" y="349.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">semantic + lexical results</text>
<text x="1110.0" y="371.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">fused with Reciprocal</text>
<text x="1110.0" y="393.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">Rank Fusion (RRF)</text>
<line x1="960" y1="136" x2="960" y2="190" stroke="#3f4ab8" stroke-width="2.5" marker-end="url(#head-3f4ab8)"/>
<line x1="700" y1="460" x2="700" y2="520" stroke="#3f4ab8" stroke-width="2.5" marker-end="url(#head-3f4ab8)"/>
<rect x="470.0" y="520" width="460" height="70" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="700.0" y="549.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">Candidate set</text>
<text x="700.0" y="571.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">top results from the selected retrieval mode</text>
<line x1="700" y1="590" x2="700" y2="640" stroke="#3f4ab8" stroke-width="2.5" marker-end="url(#head-3f4ab8)"/>
<rect x="470.0" y="640" width="460" height="80" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="700.0" y="674.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">Cross-encoder reranker  (optional)</text>
<text x="700.0" y="696.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">local ms-marco MiniLM model re-orders the candidates</text>
<line x1="700" y1="720" x2="700" y2="780" stroke="#3f4ab8" stroke-width="2.5" marker-end="url(#head-3f4ab8)"/>
<rect x="470.0" y="780" width="460" height="100" rx="12" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="700.0" y="802.0" font-size="19" font-weight="700" fill="#3f4ab8" text-anchor="middle">Evidence gate</text>
<text x="700.0" y="824.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">best chunk similarity ≥ threshold?</text>
<text x="700.0" y="846.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">only chunks above the threshold</text>
<text x="700.0" y="868.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">can become context</text>
<rect x="1010" y="790" width="330" height="80" rx="12" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
<text x="1175.0" y="824.0" font-size="19" font-weight="700" fill="#c0392b" text-anchor="middle">Refuse</text>
<text x="1175.0" y="846.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">no sources, reason returned</text>
<line x1="930.0" y1="830" x2="1010" y2="830" stroke="#c0392b" stroke-width="2.5" marker-end="url(#head-c0392b)"/>
<text x="970.0" y="818.0" font-size="14" font-weight="600" fill="#c0392b" text-anchor="middle">insufficient</text>
<line x1="700" y1="880" x2="700" y2="950" stroke="#3f4ab8" stroke-width="2.5" marker-end="url(#head-3f4ab8)"/>
<text x="750.0" y="907.0" font-size="14" font-weight="600" fill="#3f4ab8" text-anchor="middle">sufficient</text>
<rect x="380.0" y="950" width="640" height="120" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="700.0" y="993.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">LangGraph flow</text>
<text x="700.0" y="1015.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">validate query → retrieve → assess evidence → generate | refuse → validate citations</text>
<text x="700.0" y="1037.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">generator: Extractive (default)   ·   Bedrock / OpenAI-compatible (optional)</text>
<line x1="700" y1="1070" x2="700" y2="1120" stroke="#3f4ab8" stroke-width="2.5" marker-end="url(#head-3f4ab8)"/>
<rect x="470.0" y="1120" width="460" height="70" rx="12" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="700.0" y="1149.0" font-size="19" font-weight="700" fill="#3f4ab8" text-anchor="middle">Citation validation</text>
<text x="700.0" y="1171.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">every [n] must point at a retrieved chunk</text>
<rect x="300" y="1220" width="330" height="50" rx="12" fill="#e9f7ef" stroke="#2e7d4f" stroke-width="2"/>
<text x="465.0" y="1250.0" font-size="19" font-weight="700" fill="#2e7d4f" text-anchor="middle">Answer with cited sources</text>
<rect x="770" y="1220" width="330" height="50" rx="12" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
<text x="935.0" y="1250.0" font-size="19" font-weight="700" fill="#c0392b" text-anchor="middle">Refuse (no valid citation)</text>
<line x1="620" y1="1190" x2="465" y2="1220" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#head-2e7d4f)"/>
<line x1="780" y1="1190" x2="935" y2="1220" stroke="#c0392b" stroke-width="2.5" marker-end="url(#head-c0392b)"/>
<text x="60" y="506" font-size="16" font-weight="700" fill="#4b587c" text-anchor="start">Across the platform</text>
<rect x="60" y="540" width="250" height="130" rx="12" fill="#eef1f8" stroke="#7a86b8" stroke-width="2"/>
<text x="185.0" y="588.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">MCP tool server</text>
<text x="185.0" y="610.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">search, read, ask</text>
<text x="185.0" y="632.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">typed, read-only tools</text>
<rect x="60" y="700" width="250" height="130" rx="12" fill="#eef1f8" stroke="#7a86b8" stroke-width="2"/>
<text x="185.0" y="748.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">OpenTelemetry</text>
<text x="185.0" y="770.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">traces, metrics,</text>
<text x="185.0" y="792.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">structured logs</text>
<rect x="60" y="860" width="250" height="130" rx="12" fill="#eef1f8" stroke="#7a86b8" stroke-width="2"/>
<text x="185.0" y="908.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">Terraform</text>
<text x="185.0" y="930.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">AWS reference</text>
<text x="185.0" y="952.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">architecture</text>
<rect x="60" y="1020" width="250" height="130" rx="12" fill="#eef1f8" stroke="#7a86b8" stroke-width="2"/>
<text x="185.0" y="1068.0" font-size="19" font-weight="700" fill="#14213d" text-anchor="middle">GitHub Actions CI</text>
<text x="185.0" y="1090.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">tests, security,</text>
<text x="185.0" y="1112.0" font-size="15" font-weight="400" fill="#4b587c" text-anchor="middle">Terraform checks</text>
<line x1="330" y1="540" x2="330" y2="1150" stroke="#7a86b8" stroke-width="2" stroke-dasharray="3 7"/>
</svg>