<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" role="img" aria-label="AWS reference deployment defined in Terraform and not currently deployed. Clients on allowed networks reach an Application Load Balancer over HTTPS with an ACM certificate (required for a public load balancer). The load balancer forwards to an ECS Fargate service, which connects to RDS PostgreSQL 16 with pgvector in private subnets. The task pulls its image from ECR, reads database credentials from Secrets Manager, writes logs to CloudWatch, runs under least-privilege IAM roles, verifies tokens against the identity provider&#x27;s JWKS endpoint and may call Bedrock only if model ARNs are granted.">
<style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="1400" height="960" fill="#ffffff"/>
<rect x="60" y="170" width="860" height="760" rx="18" fill="#fafbff" stroke="#9aa3d9" stroke-width="2" stroke-dasharray="7 6"/>
<text x="82" y="198" font-size="15" font-weight="700" fill="#9aa3d9" text-anchor="start">VPC (Terraform reference, 2-3 availability zones)</text>
<rect x="100" y="384" width="780" height="220" rx="18" fill="#fafbff" stroke="#3f4ab8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="122" y="412" font-size="15" font-weight="700" fill="#3f4ab8" text-anchor="start">Application subnets (private with the NAT gateway option)</text>
<rect x="100" y="654" width="780" height="250" rx="18" fill="#eef6fb" stroke="#0b6f8a" stroke-width="2" stroke-dasharray="7 6"/>
<text x="122" y="682" font-size="15" font-weight="700" fill="#0b6f8a" text-anchor="start">Private data subnets</text>
<rect x="400" y="30" width="600" height="92" rx="12" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="700.0" y="71.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Clients on allowed networks</text>
<text x="700.0" y="95.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">alb_ingress_cidrs (no default)</text>
<path d="M700.0,122.0 L700.0,201.0" fill="none" stroke="#3f4ab8" stroke-width="2.5"/>
<path d="M700.0,214.0 L707.0,201.0 L693.0,201.0 z" fill="#3f4ab8"/>
<text x="714" y="152" font-size="13.5" font-weight="600" fill="#3f4ab8" text-anchor="start">HTTPS (ACM certificate, TLS 1.3 policy)</text>
<rect x="420" y="214" width="460" height="104" rx="12" fill="#fafbff" stroke="#3f4ab8" stroke-width="2"/>
<text x="650.0" y="250.0" font-size="18" font-weight="700" fill="#3f4ab8" text-anchor="middle">Application Load Balancer</text>
<text x="650.0" y="274.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">internal by default · public needs a certificate</text>
<text x="650.0" y="295.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">HTTP redirects to HTTPS</text>
<path d="M650.0,318.0 L650.0,407.0" fill="none" stroke="#3f4ab8" stroke-width="2.5"/>
<path d="M650.0,420.0 L657.0,407.0 L643.0,407.0 z" fill="#3f4ab8"/>
<text x="664" y="376" font-size="13.5" font-weight="600" fill="#3f4ab8" text-anchor="start">container port, from the ALB only</text>
<rect x="300" y="430" width="480" height="150" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="540.0" y="478.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">ECS Fargate service</text>
<text x="540.0" y="502.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">FastAPI task · AUTH_MODE=jwt</text>
<text x="540.0" y="523.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">read-only root filesystem</text>
<text x="540.0" y="544.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">egress: HTTPS + PostgreSQL only</text>
<path d="M540.0,580.0 L540.0,677.0" fill="none" stroke="#0b6f8a" stroke-width="2.5"/>
<path d="M540.0,690.0 L547.0,677.0 L533.0,677.0 z" fill="#0b6f8a"/>
<text x="554" y="642" font-size="13.5" font-weight="600" fill="#0b6f8a" text-anchor="start">PostgreSQL, from the app only</text>
<rect x="300" y="700" width="480" height="170" rx="12" fill="#ffffff" stroke="#0b6f8a" stroke-width="2"/>
<text x="540.0" y="747.0" font-size="18" font-weight="700" fill="#0b6f8a" text-anchor="middle">RDS PostgreSQL 16 + pgvector</text>
<text x="540.0" y="771.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">encrypted storage · not publicly accessible</text>
<text x="540.0" y="792.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">automated backups</text>
<text x="540.0" y="813.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">master password managed by RDS</text>
<text x="540.0" y="834.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">in Secrets Manager</text>
<text x="1150" y="200" font-size="15" font-weight="700" fill="#3f4ab8" text-anchor="middle">Reached over HTTPS (443)</text>
<rect x="980" y="224" width="340" height="92" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="1150.0" y="265.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Amazon ECR</text>
<text x="1150.0" y="289.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">image: immutable tags, scan on push</text>
<rect x="980" y="340" width="340" height="92" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="1150.0" y="381.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Secrets Manager</text>
<text x="1150.0" y="405.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">DB_USER / DB_PASSWORD</text>
<rect x="980" y="456" width="340" height="92" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="1150.0" y="497.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">CloudWatch Logs</text>
<text x="1150.0" y="521.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">one log group</text>
<rect x="980" y="572" width="340" height="92" rx="12" fill="#f3f5fb" stroke="#3f4ab8" stroke-width="2"/>
<text x="1150.0" y="613.0" font-size="18" font-weight="700" fill="#14213d" text-anchor="middle">Identity provider JWKS</text>
<text x="1150.0" y="637.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">external; token signature keys</text>
<rect x="980" y="688" width="340" height="92" rx="12" fill="#f7f2fd" stroke="#7a3fb8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="1150.0" y="729.0" font-size="18" font-weight="700" fill="#7a3fb8" text-anchor="middle">Amazon Bedrock (optional)</text>
<text x="1150.0" y="753.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">InvokeModel on listed ARNs only</text>
<rect x="980" y="804" width="340" height="92" rx="12" fill="#fff8e6" stroke="#9a6700" stroke-width="2"/>
<text x="1150.0" y="834.0" font-size="18" font-weight="700" fill="#9a6700" text-anchor="middle">IAM roles</text>
<text x="1150.0" y="858.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">execution + task roles, least privilege</text>
<text x="1150.0" y="879.0" font-size="14.5" font-weight="400" fill="#4b587c" text-anchor="middle">(attached to the task)</text>
